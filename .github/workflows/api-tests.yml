name: Тестирование DummyJSON API

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  products-api:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Получить файлы репозитория
        uses: actions/checkout@v4
      - name: Настроить Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Установить зависимости
        run: python -m pip install -r requirements.txt
      - name: Запустить API-тесты и создать JUnit XML
        run: |
          mkdir -p reports
          python -m pytest -v --junitxml=reports/junit.xml
      - name: Сохранить результаты тестирования
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-junit-results
          path: reports/junit.xml
          if-no-files-found: warn
          retention-days: 14
